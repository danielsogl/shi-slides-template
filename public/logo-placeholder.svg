<?xml version="1.0" encoding="UTF-8"?>
<!--
  Platzhalter für <LogoWall>. Querformat wie eine typische Wortmarke.
  Ersetzen durch die echten Logos – und nur mit schriftlicher Freigabe zeigen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Platzhalter für ein Kundenlogo">
  <rect x="1" y="1" width="238" height="62" rx="6" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5" />
  <text
    x="120" y="39"
    text-anchor="middle"
    font-family="'Open Sans', sans-serif"
    font-size="17" font-weight="700" letter-spacing="3"
    fill="#6b7280"
  >LOGO</text>
</svg>
